<svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a56db"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>

  <!-- Background badge -->
  <rect x="0" y="0" width="320" height="320" rx="64" fill="url(#bg)"/>

  <!-- subtle tunnel/connection arcs -->
  <path d="M 20 220 Q 160 260 300 220" stroke="#ffffff" stroke-opacity="0.12" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M 10 250 Q 160 300 310 250" stroke="#ffffff" stroke-opacity="0.08" stroke-width="10" fill="none" stroke-linecap="round"/>

  <!-- Cloud shape, top right -->
  <g transform="translate(178,52)">
    <path d="M18 46
             a20 20 0 0 1 -2 -39.8
             a26 26 0 0 1 50 -6
             a18 18 0 0 1 6 45.6
             z"
          fill="url(#cloudGrad)"/>
  </g>

  <!-- Terminal window -->
  <g>
    <rect x="52" y="118" width="180" height="132" rx="14" fill="#0b1220" fill-opacity="0.92"/>
    <rect x="52" y="118" width="180" height="28" rx="14" fill="#0b1220"/>
    <rect x="52" y="132" width="180" height="14" fill="#0b1220"/>
    <circle cx="70" cy="132" r="5" fill="#f87171"/>
    <circle cx="88" cy="132" r="5" fill="#fbbf24"/>
    <circle cx="106" cy="132" r="5" fill="#34d399"/>

    <!-- prompt chevron -->
    <path d="M76 178 L100 196 L76 214" stroke="#5eead4" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- cursor underscore -->
    <rect x="112" y="206" width="34" height="9" rx="3" fill="#e2fbf8"/>
  </g>
</svg>
