version: 2
project_name: gws
# This is an example goreleaser.yaml file with some sane defaults.
# Make sure to check the documentation at http://goreleaser.com
builds:
  - binary: gws
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/bisonschweizag/gws-cli/version.Version=v{{.Version}}
      - -X github.com/bisonschweizag/gws-cli/internal/gcloud.ClientID={{.Env.GOOGLE_OIDC_CLIENT_ID}}
      - -X github.com/bisonschweizag/gws-cli/internal/gcloud.ClientSecret={{.Env.GOOGLE_OIDC_CLIENT_SECRET}}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ .Tag }}-next"
changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore'
archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md
      - licenses.md
